apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-api-deployment
  namespace: conv-app-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      volumes:
        - name: conv-api-pvc
          persistentVolumeClaim:
            claimName: conv-api-pvc
      containers:
      - name: conv-api
        image: antonlarichev/conv-api:1.0
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        ports:
          - containerPort: 3000
        volumeMounts:
          - name: conv-api-pvc
            mountPath: /opt/app/uploads
        env:
          - name: AMQP_EXCHANGE
            valueFrom:
              secretKeyRef:
                name: shared-rabbit-secret
                key: exchange
          - name: AMQP_USER
            valueFrom:
              secretKeyRef:
                name: shared-rabbit-secret
                key: username
          - name: AMQP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: shared-rabbit-secret
                key: password
          - name: AMQP_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: shared-rabbit-secret
                key: hostname  
          - name: SEED_USERNAME
            valueFrom:
              secretKeyRef:
                name: seed-secret
                key: SEED_USERNAME
          - name: SEED_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: seed-secret
                key: SEED_USER_PASSWORD
